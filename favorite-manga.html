<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>お気に入り漫画一覧</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%2317171a%27%2F%3E%3Ctext%20x%3D%2732%27%20y%3D%2745%27%20text-anchor%3D%27middle%27%20font-size%3D%2738%27%20font-weight%3D%27600%27%20font-family%3D%27-apple-system%2CBlinkMacSystemFont%2CSegoe%20UI%2Csans-serif%27%20fill%3D%27%23eceae5%27%3EM%3C%2Ftext%3E%3C%2Fsvg%3E">
<style>

  :root {
    --bg: #eceae5;
    --bg-sub: #dedbd4;
    --panel: #f6f5f2;
    --text: #17171a;
    --text-muted: #7d7c76;
    --rule: #d2cfc8;
    --rule-strong: #17171a;
    --mark: #17171a;
    --on-mark: #eceae5;
    --select-arrow: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%2317171a' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #3a3a38;
      --bg-sub: #2e2e2c;
      --panel: #444442;
      --text: #f0efec;
      --text-muted: #a5a49d;
      --rule: #55554f;
      --rule-strong: #f0efec;
      --mark: #f0efec;
      --on-mark: #3a3a38;
      --select-arrow: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23f0efec' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Helvetica Neue", Helvetica, Arial, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
    font-size: 14px;
    line-height: 1.9;
    letter-spacing: 0.04em;
  }
  a { color: inherit; text-decoration: none; }

  /* ---- micro caps type ---- */
  .caps {
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    line-height: 1;
    font-weight: 400;
  }

  /* ---- top bar ---- */
  .topbar {
    position: sticky; top: 0; z-index: 80;
    display: flex; align-items: center; justify-content: space-between;
    gap: 24px;
    padding: 18px 40px;
    background: var(--bg);
    border-bottom: 1px solid var(--rule);
  }
  .wordmark { font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; }
  .globalnav { display: flex; gap: 0; border: 1px solid var(--rule-strong); }
  .globalnav a {
    display: flex; flex-direction: column; gap: 4px; align-items: center; justify-content: center;
    padding: 11px 26px 10px; color: var(--text);
    border-right: 1px solid var(--rule-strong);
    font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 700;
    transition: background .2s ease, color .2s ease;
  }
  .globalnav a:last-child { border-right: 0; }
  .globalnav a .nav-jp {
    font-size: 9px; letter-spacing: 0.14em; font-weight: 400;
    color: var(--text-muted); text-transform: none;
  }
  .globalnav a:hover { background: var(--panel); }
  .globalnav a.active { background: var(--mark); color: var(--on-mark); }
  .globalnav a.active .nav-jp { color: var(--on-mark); opacity: .72; }

  /* ---- hero ---- */
  .hero { padding: 72px 40px 40px; }
  .hero-index { display: block; color: var(--text-muted); margin-bottom: 22px; }
  .hero h1 {
    margin: 0;
    font-size: clamp(44px, 9vw, 116px);
    line-height: 0.92;
    font-weight: 400;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .hero-jp { margin: 20px 0 0; font-size: 13px; color: var(--text-muted); max-width: 34em; }
  .hero-count { margin-top: 28px; color: var(--text-muted); }

  /* ---- controls ---- */
  .controls {
    border-top: 1px solid var(--rule);
    padding: 0 40px;
  }
  .control-row {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 28px;
    padding: 16px 0;
    border-bottom: 1px solid var(--rule);
  }
  .control-label { color: var(--text-muted); flex-shrink: 0; min-width: 66px; }
  .switch { display: flex; flex-wrap: wrap; gap: 18px; }
  .switch button {
    border: 0; background: none; padding: 0 0 3px; margin: 0; cursor: pointer;
    color: var(--text-muted); font-family: inherit;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    border-bottom: 1px solid transparent;
  }
  .switch button:hover { color: var(--text); }
  .switch button.active { color: var(--text); border-bottom-color: var(--rule-strong); }
  .selects { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: baseline; }
  select, input[type="search"] {
    appearance: none; -webkit-appearance: none;
    border: 0; border-bottom: 1px solid var(--rule);
    background: transparent; color: var(--text);
    font-family: inherit; font-size: 12px; letter-spacing: 0.06em;
    padding: 4px 18px 5px 0; border-radius: 0; cursor: pointer;
    background-image: var(--select-arrow);
    background-position: right 0 center;
    background-size: 10px 6px;
    background-repeat: no-repeat;
  }
  select:focus, input[type="search"]:focus { outline: none; border-bottom-color: var(--rule-strong); }
  input[type="search"] {
    background-image: none; min-width: 220px; cursor: text;
  }
  input[type="search"]::placeholder { color: var(--text-muted); }
  option { background: var(--bg); color: var(--text); }

  /* ---- layout ---- */
  .page-layout { display: flex; gap: 56px; align-items: flex-start; padding: 0 40px 120px; }
  .sidebar {
    width: 214px; flex-shrink: 0;
    padding: 32px 0 20px;
  }
  .sidebar-heading { color: var(--text-muted); margin: 0 0 14px; }
  .sidebar-item {
    display: flex; gap: 10px; align-items: baseline;
    padding: 10px 0; cursor: pointer;
    border-top: 1px solid var(--rule);
  }
  .sidebar-item:hover .sidebar-title { border-bottom-color: var(--rule-strong); }
  .sidebar-num { font-size: 9px; letter-spacing: 0.1em; color: var(--text-muted); flex-shrink: 0; width: 20px; }
  .sidebar-title { font-size: 13.5px; line-height: 1.5; border-bottom: 1px solid transparent; }
  .sidebar-year { font-size: 9px; color: var(--text-muted); letter-spacing: 0.1em; margin-left: auto; flex-shrink: 0; }
  main { flex: 1; min-width: 0; padding-top: 32px; }
  .result-count { color: var(--text-muted); margin-bottom: 26px; }
  .empty-state { padding: 90px 0; color: var(--text-muted); }

  /* ---- grid view ---- */
  .card-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 44px 26px; }
  .gallery-item { cursor: pointer; }
  .gallery-thumb { position: relative; overflow: hidden; background: var(--bg-sub); }
  .gallery-item img {
    display: block; width: 100%; aspect-ratio: 2 / 3; object-fit: cover;
    transition: transform .6s cubic-bezier(.2,.7,.2,1), opacity .35s ease;
  }
  .gallery-item:hover img { transform: scale(1.045); opacity: .82; }
  .gallery-num { display: block; color: var(--text-muted); margin: 13px 0 6px; font-size: 9px; letter-spacing: 0.16em; }
  .gallery-title { font-size: 15.5px; line-height: 1.5; letter-spacing: 0.01em; }
  .gallery-meta { font-size: 11px; letter-spacing: 0.1em; color: var(--text-muted); margin-top: 5px; }
  .gallery-badge {
    position: absolute; top: 0; left: 0;
    background: var(--mark); color: var(--on-mark);
    padding: 5px 8px 4px;
  }

  /* ---- list view ---- */
  .card-list { border-top: 1px solid var(--rule); }
  .card {
    display: flex; gap: 28px; padding: 30px 0;
    border-bottom: 1px solid var(--rule); cursor: pointer;
  }
  .card:hover .card-title { border-bottom-color: var(--rule-strong); }
  .card-num { width: 34px; flex-shrink: 0; color: var(--text-muted); font-size: 9px; letter-spacing: 0.16em; padding-top: 6px; }
  .card img { width: 108px; aspect-ratio: 2/3; object-fit: cover; flex-shrink: 0; background: var(--bg-sub); }
  .card-body { flex: 1; min-width: 0; }
  .card-title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .card-title { font-size: 23px; font-weight: 400; margin: 0; line-height: 1.38; letter-spacing: 0.005em; border-bottom: 1px solid transparent; }
  .badge { background: var(--mark); color: var(--on-mark); padding: 4px 8px 3px; font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; }
  .meta-row { color: var(--text-muted); font-size: 10.5px; letter-spacing: 0.1em; margin-bottom: 12px; }
  .meta-row span + span::before { content: "／"; margin: 0 6px; opacity: .6; }
  .synopsis { font-size: 12.5px; margin: 0 0 10px; line-height: 1.95; max-width: 62em; }
  .cast-list { font-size: 11px; color: var(--text-muted); margin: 0 0 8px; line-height: 1.8; }
  .comment { font-size: 12px; color: var(--text-muted); margin: 0; padding-left: 14px; border-left: 1px solid var(--rule); }

  /* ---- modal ---- */
  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(20,20,20,.4); backdrop-filter: blur(2px);
    justify-content: flex-end;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--panel); width: min(560px, 100%); height: 100%;
    overflow-y: auto; padding: 64px 44px 80px; position: relative;
    animation: slidein .38s cubic-bezier(.2,.7,.2,1);
  }
  @keyframes slidein { from { transform: translateX(28px); opacity: 0 } to { transform: none; opacity: 1 } }
  .modal-close {
    position: absolute; top: 22px; right: 26px;
    background: none; border: 0; cursor: pointer; color: var(--text-muted);
    font-family: inherit; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
  }
  .modal-close:hover { color: var(--text); }
  .modal-image { width: 100%; aspect-ratio: 2/3; max-height: 46vh; object-fit: cover; margin-bottom: 26px; background: var(--bg-sub); }

  /* ---- back to top ---- */
  #back-to-top {
    position: fixed; bottom: 0; right: 0; z-index: 90;
    padding: 14px 20px; border: 0; border-top: 1px solid var(--rule); border-left: 1px solid var(--rule);
    background: var(--panel); color: var(--text-muted); cursor: pointer;
    font-family: inherit; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
  }
  #back-to-top:hover { color: var(--text); }

  /* ---- responsive ---- */
  @media (max-width: 1100px) { .card-grid { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 860px) {
    .topbar, .hero, .controls, .page-layout { padding-left: 22px; padding-right: 22px; }
    .hero { padding-top: 48px; }
    .page-layout { flex-direction: column; gap: 0; }
    /* 索引は縦に長くなりすぎるため小さい画面では隠す(検索・絞り込みで代替) */
    .sidebar { display: none; }
    main { padding-top: 24px; width: 100%; }
    .card-grid { grid-template-columns: repeat(3, 1fr); gap: 32px 18px; }
    .modal-box { padding: 56px 24px 60px; }
    .globalnav a { padding: 10px 14px 9px; font-size: 12px; letter-spacing: 0.12em; }
    .wordmark { font-size: 10px; letter-spacing: 0.24em; }
  }
  @media (max-width: 560px) {
    .card-grid { grid-template-columns: repeat(2, 1fr); }
    .gallery-title { font-size: 14px; }
    .card-title { font-size: 19px; }
    .card { flex-wrap: wrap; gap: 18px; }
    .card-num { width: 100%; padding-top: 0; }
    .card img { width: 84px; }
    /* 3つのタブを横一杯に均等配置し、見切れを防ぐ */
    .topbar { padding: 10px 16px; gap: 0; }
    .topbar, .hero, .controls, .page-layout { padding-left: 16px; padding-right: 16px; }
    .wordmark { display: none; }
    .globalnav { width: 100%; }
    .globalnav a { flex: 1 1 0; min-width: 0; padding: 11px 4px 10px; font-size: 12px; letter-spacing: 0.06em; }
    .globalnav a .nav-jp { font-size: 8.5px; letter-spacing: 0.08em; }
  }

  /* ---- manga: 作者・ジャンルタグ・外部リンク ---- */
  .card-author { font-size: 13px; color: var(--text-muted); margin: 0 0 10px; letter-spacing: 0.02em; }
  .gallery-author { font-size: 11px; line-height: 1.5; color: var(--text-muted); margin-top: 4px; }
  .sidebar-author { font-size: 10.5px; color: var(--text-muted); line-height: 1.45; margin-top: 2px; }
  .sidebar-item { flex-wrap: wrap; }
  .sidebar-item .sidebar-title { flex: 1; }
  .sidebar-author { width: 100%; padding-left: 30px; }
  .genre-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .tag {
    font-size: 10px; letter-spacing: 0.1em; color: var(--text-muted);
    border: 1px solid var(--rule); padding: 4px 9px 3px;
  }
  .ext-link {
    display: inline-block; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--text); border-bottom: 1px solid var(--rule-strong); padding-bottom: 2px;
  }
  .ext-link:hover { color: var(--text-muted); border-bottom-color: var(--text-muted); }
</style>
</head>

<header class="topbar">
  <span class="wordmark">FAVORITES ARCHIVE</span>
  <nav class="globalnav">
    <a href="./favorite-anime.html">Anime<span class="nav-jp">アニメ</span></a>

    <a href="./favorite-movie.html">Movie<span class="nav-jp">映画</span></a>
  </nav>
</header>

<section class="hero">
  <span class="hero-index caps">Category &mdash; 02</span>
  <h1>Manga</h1>
  <p class="hero-jp">読んでよかった漫画作品の記録。出版年・ジャンルで絞り込み、サムネイルまたは詳細で閲覧できます。</p>
  <p class="hero-count caps" id="hero-count"></p>
</section>

<div class="controls">
  <div class="control-row">
    <span class="control-label caps">View</span>
    <div class="switch">
      <button id="btn-view-gallery" class="active" onclick="setView('gallery')">Grid</button>
      <button id="btn-view-list" onclick="setView('list')">List</button>
    </div>
    <span class="control-label caps" style="margin-left:auto">Select</span>
    <div class="switch">
      <button class="active" data-category="all" onclick="setCategory('all')">All</button>
      <button data-category="hof" onclick="setCategory('hof')">殿堂入り</button>
    </div>
  </div>
  <div class="control-row">
    <span class="control-label caps">Filter</span>
    <div class="selects">
      <select id="genre-filter" onchange="render()">
        <option value="all">すべてのジャンル</option>
      </select>
      <select id="decade-select" onchange="render()">
        <option value="all">すべての年代</option>
        <option value="1970">1970年代</option>
        <option value="1980">1980年代</option>
        <option value="1990">1990年代</option>
        <option value="2000">2000年代</option>
        <option value="2010">2010年代</option>
        <option value="2020">2020年代</option>
      </select>
      <input type="search" id="search-box" placeholder="SEARCH &mdash; タイトル・作者・ジャンル" oninput="render()">
    </div>
  </div>
  <div class="control-row">
    <span class="control-label caps">Order</span>
    <div class="selects">
      <select id="sort-select" onchange="render()">
        <option value="firstVolume" selected>第1巻の出版日が新しい順</option>
        <option value="added">新しく追加した順</option>
        <option value="title">タイトル順</option>
        <option value="volumes">巻数が多い順</option>
      </select>
    </div>
    <div class="switch" id="sort-dir-toggle">
      <button id="btn-sort-desc" class="active" onclick="setSortDir('desc')">Desc</button>
      <button id="btn-sort-asc" onclick="setSortDir('asc')">Asc</button>
    </div>
  </div>
</div>

<div class="page-layout">
  <aside class="sidebar">
    <p class="sidebar-heading caps">Index &mdash; All Titles</p>
    <div id="sidebar-list"></div>
  </aside>
  <main>
    <p class="result-count caps" id="result-count"></p>
    <div id="app"></div>
  </main>
</div>

<div id="modal-overlay" class="modal-overlay" onclick="handleOverlayClick(event)">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">Close &#10005;</button>
    <div id="modal-body"></div>
  </div>
</div>

<button id="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="ページ上部に戻る">&uarr; Top</button>

  { id: 'helck', title: 'Helck(ヘルク)', author: '七尾ナナキ', volumeCount: 12, volumes: '全12巻(完結)', hof: false, comment: '', addedDate: '2026-08-20', image: 'images/favorite-manga/helck.jpg', magazine: '裏サンデー', firstVolumeDate: '2014-08-18', genres: ['ダークファンタジー', 'バトル', '魔王'], amazonUrl: 'https://www.amazon.co.jp/dp/4091252362' },
  { id: 'look-back', title: 'ルックバック', author: '藤本タツキ', volumeCount: 1, volumes: '全1巻(完結)', hof: false, comment: '', addedDate: '2026-08-21', image: 'images/favorite-manga/look-back.jpg', magazine: '少年ジャンプ+', firstVolumeDate: '2021-09-03', genres: ['青春', 'ヒューマンドラマ', 'ホラー'], amazonUrl: 'https://www.amazon.co.jp/dp/4088827821' },
  { id: 'konosekai-no-katasumi-ni', title: 'この世界の片隅に', author: 'こうの史代', volumeCount: 3, volumes: '全3巻(完結)', hof: false, comment: '', addedDate: '2026-08-21', image: 'images/favorite-manga/konosekai-no-katasumi-ni.jpg', magazine: '漫画アクション', firstVolumeDate: '2008-01-12', genres: ['戦争', 'ヒューマンドラマ', '日常'], amazonUrl: 'https://www.amazon.co.jp/dp/4575941468' },
  { id: 'make-heroine-ga-oosugiru', title: '負けヒロインが多すぎる', author: '原作:雨森たきび/漫画:いたち/キャラクター原案:いみぎむる', volumeCount: 6, volumes: '6巻(連載中)', hof: false, comment: '', addedDate: '2026-08-21', image: 'images/favorite-manga/make-heroine-ga-oosugiru.jpg', magazine: 'マンガワン/裏サンデー', firstVolumeDate: '2022-10-12', genres: ['ラブコメ', '青春', '学園'], amazonUrl: 'https://www.amazon.co.jp/dp/4098513366' }
];
let state = { view: 'gallery', category: 'all', sortDir: 'desc' };

function setView(view) {
  state.view = view;
  document.getElementById('btn-view-list').classList.toggle('active', view === 'list');
  document.getElementById('btn-view-gallery').classList.toggle('active', view === 'gallery');
  render();
}

function setCategory(category) {
  state.category = category;
  document.querySelectorAll('.switch button[data-category]').forEach(function (btn) {
    btn.classList.toggle('active', btn.dataset.category === category);
  });
  render();
}

function setSortDir(dir) {
  state.sortDir = dir;
  document.getElementById('btn-sort-desc').classList.toggle('active', dir === 'desc');
  document.getElementById('btn-sort-asc').classList.toggle('active', dir === 'asc');
  render();
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function pad(n) {
  return String(n).padStart(3, '0');
}

function populateGenreFilter() {
  const select = document.getElementById('genre-filter');
  const genres = Array.from(new Set(MANGA_DATA.reduce(function (acc, item) { return acc.concat(item.genres); }, []))).sort(function (a, b) { return a.localeCompare(b, 'ja'); });
  genres.forEach(function (g) {
    const opt = document.createElement('option');
    opt.value = g;
    opt.textContent = g;
    select.appendChild(opt);
  });
}

function getFilteredSorted() {
  const query = document.getElementById('search-box').value.trim().toLowerCase();
  const genre = document.getElementById('genre-filter').value;
  const decade = document.getElementById('decade-select').value;
  const sortKey = document.getElementById('sort-select').value;

  let items = MANGA_DATA.filter(function (item) {
    if (state.category === 'hof' && !item.hof) return false;
    if (genre !== 'all' && item.genres.indexOf(genre) === -1) return false;
    if (decade !== 'all') {
      if (!item.firstVolumeDate) return false;
      const year = parseInt(item.firstVolumeDate.slice(0, 4), 10);
      if (Math.floor(year / 10) * 10 !== Number(decade)) return false;
    }
    if (!query) return true;
    const haystack = (item.title + ' ' + item.author + ' ' + item.genres.join(' ')).toLowerCase();
    return haystack.indexOf(query) !== -1;
  });

  items = items.slice().sort(function (a, b) {
    let cmp;
    if (sortKey === 'title') cmp = a.title.localeCompare(b.title, 'ja');
    else if (sortKey === 'volumes') cmp = a.volumeCount - b.volumeCount;
    else if (sortKey === 'added') cmp = 0;
    else cmp = (a.firstVolumeDate || '').localeCompare(b.firstVolumeDate || '');
    return state.sortDir === 'asc' ? cmp : -cmp;
  });

  return items;
}

function buildDetailHtml(item) {
  const badgeHtml = item.hof ? '<span class="badge">殿堂入り</span>' : '';
  const genreTags = item.genres.map(function (g) { return '<span class="tag">' + escapeHtml(g) + '</span>'; }).join('');
  const commentHtml = item.comment ? '<p class="comment">' + escapeHtml(item.comment) + '</p>' : '';
  const metaParts = [
    escapeHtml(item.magazine),
    escapeHtml(item.volumes),
    '第1巻 ' + escapeHtml(item.firstVolumeDate)
  ];
  return (
    '<div class="card-title-row"><h2 class="card-title">' + escapeHtml(item.title) + '</h2>' +
    badgeHtml + '</div>' +
    '<p class="card-author">' + escapeHtml(item.author) + '</p>' +
    '<div class="meta-row">' + metaParts.map(function (p) { return '<span>' + p + '</span>'; }).join('') + '</div>' +
    '<div class="genre-row">' + genreTags + '</div>' +
    '<a class="ext-link" href="' + escapeHtml(item.amazonUrl) + '" target="_blank" rel="noopener">Amazon &#8599;</a>' +
    commentHtml
  );
}

function renderList(items) {
  return '<div class="card-list">' + items.map(function (item, i) {
    return (
      '<div class="card" data-id="' + escapeHtml(item.id) + '">' +
      '<span class="card-num">' + pad(i + 1) + '</span>' +
      '<img src="' + escapeHtml(item.image) + '" alt="' + escapeHtml(item.title) + '" loading="lazy">' +
      '<div class="card-body">' + buildDetailHtml(item) + '</div></div>'
    );
  }).join('') + '</div>';
}

function renderGallery(items) {
  return '<div class="card-grid">' + items.map(function (item, i) {
    const badgeHtml = item.hof ? '<span class="badge gallery-badge">殿堂入り</span>' : '';
    return (
      '<div class="gallery-item" data-id="' + escapeHtml(item.id) + '">' +
      '<div class="gallery-thumb">' +
      '<img src="' + escapeHtml(item.image) + '" alt="' + escapeHtml(item.title) + '" loading="lazy">' +
      badgeHtml +
      '</div>' +
      '<span class="gallery-num">' + pad(i + 1) + '</span>' +
      '<div class="gallery-title">' + escapeHtml(item.title) + '</div>' +
      '<div class="gallery-author">' + escapeHtml(item.author) + '</div>' +
      '</div>'
    );
  }).join('') + '</div>';
}

function openModal(id) {
  const item = MANGA_DATA.find(function (d) { return d.id === id; });
  if (!item) return;
  document.getElementById('modal-body').innerHTML =
    '<img src="' + escapeHtml(item.image) + '" alt="' + escapeHtml(item.title) + '" class="modal-image">' +
    buildDetailHtml(item);
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function handleOverlayClick(event) {
  if (event.target.id === 'modal-overlay') closeModal();
}

document.addEventListener('keydown', function (event) {
  if (event.key === 'Escape') closeModal();
});

document.getElementById('app').addEventListener('click', function (event) {
  if (event.target.closest('.ext-link')) return;
  const target = event.target.closest('.gallery-item, .card');
  if (target) openModal(target.dataset.id);
});

document.getElementById('sidebar-list').addEventListener('click', function (event) {
  const sidebarItem = event.target.closest('.sidebar-item');
  if (sidebarItem) openModal(sidebarItem.dataset.id);
});

function renderSidebar() {
  const sorted = MANGA_DATA.slice().sort(function (a, b) { return a.title.localeCompare(b.title, 'ja'); });
  document.getElementById('sidebar-list').innerHTML = sorted.map(function (item, i) {
    return (
      '<div class="sidebar-item" data-id="' + escapeHtml(item.id) + '">' +
      '<span class="sidebar-num">' + pad(i + 1) + '</span>' +
      '<span class="sidebar-title">' + escapeHtml(item.title) + '</span>' +
      '<span class="sidebar-author">' + escapeHtml(item.author) + '</span>' +
      '</div>'
    );
  }).join('');
}

function render() {
  const items = getFilteredSorted();
  const app = document.getElementById('app');
  document.getElementById('result-count').textContent = items.length + ' of ' + MANGA_DATA.length + ' titles';
  if (items.length === 0) {
    app.innerHTML = '<div class="empty-state">該当する作品がありません</div>';
    return;
  }
  app.innerHTML = state.view === 'list' ? renderList(items) : renderGallery(items);
}

document.getElementById('hero-count').textContent = MANGA_DATA.length + ' Titles Archived';
populateGenreFilter();
renderSidebar();
render();
</script>
</body>
