<title>お気に入りアニメ一覧</title>
<style>
  :root {
    --bg: #fafafa;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --text-muted: #666666;
    --border: #e0e0e0;
    --accent: #e85d75;
    --badge-hof: #f5a623;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --card-bg: #1e2126;
      --text: #eaeaea;
      --text-muted: #9a9a9a;
      --border: #33363c;
      --accent: #ff7a93;
      --badge-hof: #f5a623;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header.page-header { padding: 24px 20px 16px; max-width: 1320px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  .subtitle { color: var(--text-muted); margin: 0 0 20px; font-size: 0.9rem; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
  .view-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .view-toggle button { padding: 8px 14px; border: none; background: var(--card-bg); color: var(--text); cursor: pointer; font-size: 0.85rem; }
  .view-toggle button.active { background: var(--accent); color: #fff; }
  .filter-badges { display: inline-flex; gap: 6px; }
  .filter-badges button { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); cursor: pointer; font-size: 0.8rem; }
  .filter-badges button.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  input[type="search"] { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); font-size: 0.85rem; min-width: 180px; }
  select { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); font-size: 0.85rem; }
  .page-layout { max-width: 1320px; margin: 0 auto; padding: 0 20px 40px; display: flex; gap: 24px; align-items: flex-start; }
  .sidebar {
    width: 220px; flex-shrink: 0; border-right: 1px solid var(--border); padding-right: 16px;
    max-height: calc(100vh - 160px); overflow-y: auto; position: sticky; top: 20px;
  }
  .sidebar-heading { font-size: 0.78rem; font-weight: 600; color: var(--text-muted); margin: 0 0 8px; }
  .sidebar-item { padding: 6px 8px; border-radius: 8px; cursor: pointer; margin-bottom: 2px; }
  .sidebar-item:hover { background: var(--border); }
  .sidebar-title { font-size: 0.82rem; font-weight: 600; line-height: 1.3; }
  .sidebar-year { font-size: 0.72rem; color: var(--text-muted); margin-top: 1px; }
  main { flex: 1; min-width: 0; }
  @media (max-width: 780px) {
    .page-layout { flex-direction: column; }
    .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); padding-right: 0; padding-bottom: 12px; max-height: 240px; position: static; }
  }
  .empty-state { text-align: center; color: var(--text-muted); padding: 60px 20px; }
  .card-list { display: flex; flex-direction: column; gap: 16px; }
  .card { display: flex; gap: 16px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .card img { width: 120px; height: 168px; object-fit: cover; border-radius: 8px; flex-shrink: 0; background: var(--border); }
  .card-body { flex: 1; min-width: 0; }
  .card-title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .card-title { font-size: 1.1rem; font-weight: 600; margin: 0; }
  .badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 999px; color: #fff; }
  .badge.hof { background: var(--badge-hof); }
  .meta-row { color: var(--text-muted); font-size: 0.8rem; margin-bottom: 8px; }
  .synopsis { font-size: 0.85rem; margin: 0 0 8px; line-height: 1.6; }
  .cast-list { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; }
  .comment { font-size: 0.82rem; font-style: italic; color: var(--text-muted); }
  .card-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
  .gallery-item { text-align: center; cursor: pointer; }
  .gallery-item img { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 8px; background: var(--border); }
  .gallery-item .gallery-title { font-size: 0.95rem; margin-top: 8px; line-height: 1.3; font-weight: 500; }
  @media (max-width: 900px) {
    .card-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 480px) {
    .card { flex-direction: column; }
    .card img { width: 100%; height: 200px; }
    .card-grid { grid-template-columns: repeat(2, 1fr); }
    .modal-box { max-width: 100%; }
  }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal-box { background: var(--card-bg); border-radius: 12px; max-width: 480px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 20px; position: relative; }
  .modal-close { position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; color: var(--text-muted); cursor: pointer; }
  .modal-image { width: 100%; max-height: 320px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; background: var(--border); }
  .page-nav { display: flex; gap: 8px; margin-bottom: 12px; }
  .page-nav a { padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); text-decoration: none; font-size: 0.85rem; }
  .page-nav a.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  #back-to-top {
    position: fixed; bottom: 24px; right: 24px; z-index: 90;
    padding: 10px 16px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--card-bg); color: var(--text); cursor: pointer; font-size: 0.85rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }

</style>
</head>

<header class="page-header">
  <h1>お気に入りアニメ一覧</h1>

    <a href="./favorite-anime.html" class="active">アニメ一覧</a>
    <a href="./favorite-manga.html">漫画一覧</a>
    <a href="./favorite-movie.html">映画一覧</a>
  </nav>
  <p class="subtitle">見てよかった作品の記録です。</p>
  <div class="controls">
    <div class="view-toggle">
      <button id="btn-view-gallery" class="active" onclick="setView('gallery')">サムネ</button>
      <button id="btn-view-list" onclick="setView('list')">詳細</button>
    </div>
    <div class="filter-badges">

      <button data-category="hof" onclick="setCategory('hof')">殿堂入り</button>
    </div>
    <select id="genre-filter" onchange="render()">

    </select>
    <select id="decade-select" onchange="render()">

      <option value="1980">1980年代</option>
      <option value="1990">1990年代</option>
      <option value="2000">2000年代</option>
      <option value="2010">2010年代</option>
      <option value="2020">2020年代</option>
    </select>
    <input type="search" id="search-box" placeholder="タイトル・ジャンルで検索" oninput="render()">
    <select id="sort-select" onchange="render()">
      <option value="year">制作年順</option>
      <option value="added">新しく追加した順</option>
      <option value="title">タイトル順</option>
    </select>
    <div class="view-toggle" id="sort-dir-toggle">
      <button id="btn-sort-desc" class="active" onclick="setSortDir('desc')">降順</button>
      <button id="btn-sort-asc" onclick="setSortDir('asc')">昇順</button>
    </div>
  </div>
</header>
<div class="page-layout">
  <aside class="sidebar">
    <p class="sidebar-heading">全作品(タイトル順)</p>
    <div id="sidebar-list"></div>
  </aside>
  <main id="app"></main>
</div>
<div id="modal-overlay" class="modal-overlay" onclick="handleOverlayClick(event)">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modal-body"></div>
  </div>
</div>
<button id="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="ページ上部に戻る">↑ 上に戻る</button>

  state.view = view;
  document.getElementById('btn-view-list').classList.toggle('active', view === 'list');
  document.getElementById('btn-view-gallery').classList.toggle('active', view === 'gallery');
  render();
}

function setCategory(category) {
  state.category = category;
  document.querySelectorAll('.filter-badges button').forEach(function (btn) {
    btn.classList.toggle('active', btn.dataset.category === category);
  });
  render();
}

function setSortDir(dir) {
  state.sortDir = dir;
  document.getElementById('btn-sort-desc').classList.toggle('active', dir === 'desc');
  document.getElementById('btn-sort-asc').classList.toggle('active', dir === 'asc');
  render();
}

function populateGenreFilter() {
  const select = document.getElementById('genre-filter');
  const genres = Array.from(new Set(ANIME_DATA.reduce(function (acc, item) { return acc.concat(item.genres); }, []))).sort(function (a, b) { return a.localeCompare(b, 'ja'); });
  genres.forEach(function (g) {
    const opt = document.createElement('option');
    opt.value = g;
    opt.textContent = g;
    select.appendChild(opt);
  });
}

function getFilteredSorted() {
  const query = document.getElementById('search-box').value.trim().toLowerCase();
  const genre = document.getElementById('genre-filter').value;
  const sortKey = document.getElementById('sort-select').value;
  const decade = document.getElementById('decade-select').value;

  let items = ANIME_DATA.filter(function (item) {
    if (state.category !== 'all' && item.category !== state.category) return false;
    if (genre !== 'all' && item.genres.indexOf(genre) === -1) return false;
    if (decade !== 'all' && Math.floor(item.year / 10) * 10 !== Number(decade)) return false;
    if (!query) return true;
    const haystack = (item.title + ' ' + item.genres.join(' ')).toLowerCase();
    return haystack.indexOf(query) !== -1;
  });

  items.sort(function (a, b) {
    let cmp;
    if (sortKey === 'year') cmp = a.year - b.year;
    else if (sortKey === 'added') cmp = a.addedDate.localeCompare(b.addedDate);
    else cmp = a.title.localeCompare(b.title, 'ja');
    return state.sortDir === 'asc' ? cmp : -cmp;
  });

  return items;
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function buildDetailHtml(item) {
  const badgeHtml = item.category === 'hof' ? '<span class="badge hof">殿堂入り</span>' : '';
  const castText = item.cast.map(function (c) { return c.character + ':' + c.actor; }).join(' / ');
  return (
    '<div class="card-title-row"><h2 class="card-title">' + escapeHtml(item.title) + '</h2>' +
    badgeHtml + '</div>' +
    '<div class="meta-row">' + item.year + '年 / ' + escapeHtml(item.studio) + ' / ' + escapeHtml(item.creator) + ' / 全' + item.episodes + '話 / ' + item.genres.map(escapeHtml).join('・') + '</div>' +
    '<p class="synopsis">' + escapeHtml(item.synopsis) + '</p>' +
    '<p class="cast-list">' + escapeHtml(castText) + '</p>' +
    (item.comment ? '<p class="comment">' + escapeHtml(item.comment) + '</p>' : '')
  );
}

function renderList(items) {
  return items.map(function (item) {
    return (
      '<div class="card">' +
      '<img src="' + escapeHtml(item.image) + '" alt="' + escapeHtml(item.title) + '" loading="lazy">' +
      '<div class="card-body">' + buildDetailHtml(item) + '</div></div>'
    );
  }).join('');
}

function renderGallery(items) {
  return '<div class="card-grid">' + items.map(function (item) {
    return (
      '<div class="gallery-item" data-id="' + escapeHtml(item.id) + '">' +
      '<img src="' + escapeHtml(item.image) + '" alt="' + escapeHtml(item.title) + '" loading="lazy">' +
      '<div class="gallery-title">' + escapeHtml(item.title) + '</div>' +
      '</div>'
    );
  }).join('') + '</div>';
}

function openModal(id) {
  const item = ANIME_DATA.find(function (i) { return i.id === id; });
  if (!item) return;
  document.getElementById('modal-body').innerHTML =
    '<img src="' + escapeHtml(item.image) + '" alt="' + escapeHtml(item.title) + '" class="modal-image">' +
    buildDetailHtml(item);
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

function handleOverlayClick(event) {
  if (event.target.id === 'modal-overlay') closeModal();
}

document.addEventListener('keydown', function (event) {
  if (event.key === 'Escape') closeModal();
});

document.getElementById('app').addEventListener('click', function (event) {
  const galleryItem = event.target.closest('.gallery-item');
  if (galleryItem) openModal(galleryItem.dataset.id);
});

document.getElementById('sidebar-list').addEventListener('click', function (event) {
  const sidebarItem = event.target.closest('.sidebar-item');
  if (sidebarItem) openModal(sidebarItem.dataset.id);
});

function renderSidebar() {
  const sorted = ANIME_DATA.slice().sort(function (a, b) { return a.title.localeCompare(b.title, 'ja'); });
  document.getElementById('sidebar-list').innerHTML = sorted.map(function (item) {
    return (
      '<div class="sidebar-item" data-id="' + escapeHtml(item.id) + '">' +
      '<div class="sidebar-title">' + escapeHtml(item.title) + '</div>' +
      '<div class="sidebar-year">' + item.year + '年</div>' +
      '</div>'
    );
  }).join('');
}

function render() {
  const items = getFilteredSorted();
  const app = document.getElementById('app');
  if (items.length === 0) {
    app.innerHTML = '<div class="empty-state">該当する作品がありません</div>';
    return;
  }
  if (state.view === 'list') {
    app.innerHTML = '<div class="card-list">' + renderList(items) + '</div>';
  } else {
    app.innerHTML = renderGallery(items);
  }
}

populateGenreFilter();
renderSidebar();
render();
</script>
</body>
</html>
