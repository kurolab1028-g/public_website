<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>kurolab1028-g</title>
<style>
  :root {
    color-scheme: light;
    --page-bg: #f9fafb;
    --surface: #ffffff;
    --border: #e4e7ec;
    --text-primary: #101828;
    --text-secondary: #667085;
    --brand: #465fff;
    --brand-tint: #ecf3ff;
    --shadow-card: 0 1px 3px rgba(16,24,40,0.06), 0 1px 2px rgba(16,24,40,0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page-bg: #101828;
      --surface: #1a2231;
      --border: #1d2939;
      --text-primary: #f9fafb;
      --text-secondary: #98a2b3;
      --brand: #7592ff;
      --brand-tint: rgba(70,95,255,0.14);
      --shadow-card: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.24);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--page-bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main { width: 100%; max-width: 440px; }
  h1 { font-size: 15px; font-weight: 600; color: var(--text-secondary); margin: 0 0 16px; letter-spacing: 0.02em; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  a.page-card {
    display: block;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    box-shadow: var(--shadow-card);
    text-decoration: none;
    color: inherit;
  }
  a.page-card:hover { border-color: var(--brand); }
  .page-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .page-desc { font-size: 13.5px; color: var(--text-secondary); }
  .tag {
    display: inline-block; font-size: 11px; font-weight: 600; color: var(--brand);
    background: var(--brand-tint); border-radius: 999px; padding: 2px 8px; margin-top: 10px;
  }
</style>
</head>
<body>
<main>
  <h1>Pages</h1>
  <ul>
    <li>
      <a class="page-card" href="https://kurolab1028-g.github.io/public_website/kakeibo-analytics.html">
        <div class="page-name">家計簿アナリティクス</div>
        <div class="page-desc">マネーフォワード ME の家計簿データを分析するダッシュボード</div>
        <span class="tag">household finance</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
