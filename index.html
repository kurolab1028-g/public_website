  :root {
    color-scheme: light;
    --font-sans: 'Outfit', "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --page-bg: #f9fafb;
    --surface: #ffffff;
    --surface-2: #f2f4f7;
    --border: #e4e7ec;
    --text-primary: #101828;
    --text-secondary: #667085;
    --text-muted: #98a2b3;
    --brand: #465fff;
    --brand-tint: #ecf3ff;
    --success: #039855;
    --success-bg: #ecfdf3;
    --error: #d92d20;
    --error-bg: #fef3f2;
    --stamp-red: #d92d20;
    --good: #039855;
    --icon-bg: #f2f4f7;
    --series-income: #465fff;
    --series-expense: #f79009;
    --role-1: #465fff;
    --role-2: #f79009;
    --role-3: #12b76a;
    --role-4: #7a5af8;
    --role-5: #0ba5ec;
    --shadow-card: 0 1px 3px rgba(16,24,40,0.06), 0 1px 2px rgba(16,24,40,0.04);
    --shadow-pop: 0 12px 24px -8px rgba(16,24,40,0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page-bg: #101828;
      --surface: #1a2231;
      --surface-2: #1d2939;
      --border: #1d2939;
      --text-primary: #f9fafb;
      --text-secondary: #98a2b3;
      --text-muted: #667085;
      --brand: #7592ff;
      --brand-tint: rgba(70,95,255,0.14);
      --success: #12b76a;
      --success-bg: rgba(18,183,106,0.14);
      --error: #f97066;
      --error-bg: rgba(240,68,56,0.14);
      --stamp-red: #f97066;
      --good: #12b76a;
      --icon-bg: #1d2939;
      --series-income: #7592ff;
      --series-expense: #fdb022;
      --role-1: #7592ff;
      --role-2: #fdb022;
      --role-3: #32d583;
      --role-4: #9b8afb;
      --role-5: #36bffa;
      --shadow-card: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.24);
      --shadow-pop: 0 12px 24px -8px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page-bg: #101828;
    --surface: #1a2231;
    --surface-2: #1d2939;
    --border: #1d2939;
    --text-primary: #f9fafb;
    --text-secondary: #98a2b3;
    --text-muted: #667085;
    --brand: #7592ff;
    --brand-tint: rgba(70,95,255,0.14);
    --success: #12b76a;
    --success-bg: rgba(18,183,106,0.14);
    --error: #f97066;
    --error-bg: rgba(240,68,56,0.14);
    --stamp-red: #f97066;
    --good: #12b76a;
    --icon-bg: #1d2939;
    --series-income: #7592ff;
    --series-expense: #fdb022;
    --role-1: #7592ff;
    --role-2: #fdb022;
    --role-3: #32d583;
    --role-4: #9b8afb;
    --role-5: #36bffa;
    --shadow-card: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.24);
    --shadow-pop: 0 12px 24px -8px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--page-bg);
    color: var(--text-primary);
    font-family: var(--font-sans);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  svg.icon { display: block; flex: none; }

  .app-shell { display: flex; min-height: 100vh; }

  /* ---------- sidebar ---------- */
  .sidebar-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(16,24,40,0.45);
    z-index: 40;
  }
  .sidebar {
    width: 280px;
    flex: none;
    background: var(--surface);
    border-right: 1px solid var(--border);
    min-height: 100vh;
    position: sticky;
    top: 0;
    align-self: flex-start;
    max-height: 100vh;
    overflow-y: auto;
    padding: 22px 0 24px;
    z-index: 41;
  }
  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 20px 18px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .brand-mark {
    width: 38px; height: 38px; flex: none;
    border-radius: 10px;
    background: var(--brand);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .brand-text h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .brand-text .period {
    font-size: 12px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  .sidebar-close {
    display: none;
    margin-left: auto;
    background: none;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 6px;
    border-radius: 8px;
  }
  .sidebar-close:hover { background: var(--surface-2); }

  .nav-group-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 20px;
    margin-top: 16px;
  }
  .nav-group-label:first-of-type { margin-top: 4px; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: calc(100% - 24px);
    margin: 2px 12px;
    padding: 9px 10px;
    border: none;
    background: none;
    border-radius: 8px;
    text-align: left;
    cursor: pointer;
    font-size: 14.5px;
    color: var(--text-secondary);
    font-family: inherit;
  }
  .nav-item svg.icon { color: var(--text-muted); }
  .nav-item:hover { background: var(--surface-2); color: var(--text-primary); }
  .nav-item.active {
    background: var(--brand-tint);
    color: var(--brand);
    font-weight: 600;
  }
  .nav-item.active svg.icon { color: var(--brand); }
  .nav-item .nav-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-item .nav-net {
    flex: none;
    font-size: 11.5px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 999px;
    font-variant-numeric: tabular-nums;
  }
  .nav-net.pos { background: var(--success-bg); color: var(--success); }
  .nav-net.neg { background: var(--error-bg); color: var(--error); }
  .nav-item.overview-item { font-weight: 600; }

  /* ---------- topbar + main ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    position: sticky; top: 0; z-index: 30;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px clamp(16px, 3vw, 28px);
    display: flex; align-items: center; gap: 14px;
  }
  .hamburger-btn, .theme-toggle {
    width: 40px; height: 40px; flex: none;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    cursor: pointer;
  }
  .hamburger-btn:hover, .theme-toggle:hover { background: var(--surface-2); }
  .hamburger-btn { display: none; }
  .topbar-title { font-size: 15px; font-weight: 600; display: none; }
  .topbar-spacer { flex: 1; }

  .content { padding: 22px clamp(16px, 3vw, 28px) 64px; max-width: 1180px; }

  .view-head { margin-bottom: 4px; }
  .view-head h2 { font-size: clamp(20px, 2.6vw, 24px); font-weight: 700; margin: 0 0 4px; letter-spacing: -0.01em; }
  .view-meta { color: var(--text-secondary); font-size: 14px; }

  /* ---------- kpi cards ---------- */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin: 18px 0 4px;
  }
  .kpi {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 20px;
    box-shadow: var(--shadow-card);
    display: flex; flex-direction: column; gap: 10px;
  }
  .kpi-icon {
    width: 42px; height: 42px;
    border-radius: 10px;
    background: var(--icon-bg);
    color: var(--brand);
    display: flex; align-items: center; justify-content: center;
  }
  .kpi .label { font-size: 13.5px; color: var(--text-secondary); }

  function stackedMonthlyChart(container, subcats, byMonth, colors) {
    container.innerHTML = "";
    var W = 880, H = 260;
    var marginL = 54, marginR = 12, marginT = 22, marginB = 30;
    var plotW = W - marginL - marginR, plotH = H - marginT - marginB;
    var totals = byMonth.map(function (m) { return subcats.reduce(function (s, k) { return s + Math.abs(m.values[k]); }, 0); });
    var maxTotal = Math.max.apply(null, totals) || 1;
    var yMax = Math.ceil((maxTotal * 1.15) / 10000) * 10000;

    var s = svg("svg", { viewBox: "0 0 " + W + " " + H, role: "img" });
    [0, 0.5, 1].forEach(function (f) {
      var gy = marginT + plotH * (1 - f);
      s.appendChild(svg("line", { class: "gridline", x1: marginL, x2: W - marginR, y1: gy, y2: gy }));
      var t = svg("text", { class: "tick-label", x: marginL - 8, y: gy + 3, "text-anchor": "end" });
      t.textContent = fmtMan(yMax * f);
      s.appendChild(t);
    });
    s.appendChild(svg("line", { class: "baseline", x1: marginL, x2: W - marginR, y1: marginT + plotH, y2: marginT + plotH }));

    var slotW = plotW / byMonth.length;
    var barW = Math.min(26, slotW * 0.55);
    var tip = makeTooltip(container);

    byMonth.forEach(function (row, i) {
      var cx = marginL + slotW * (i + 0.5);
      var cursorY = marginT + plotH;
      subcats.forEach(function (subName, si) {
        var val = Math.abs(row.values[subName]);
        var h = (val / yMax) * plotH;
        if (h < 0.3) return;
        var bar = svg("rect", { class: "bar", x: cx - barW / 2, y: cursorY - h, width: barW, height: h, fill: colors[si % colors.length] });
        bar.addEventListener("mousemove", function (e) {
          var r = container.getBoundingClientRect();
          tip.show(e.clientX - r.left, e.clientY - r.top - 10, row.label + " " + subName, fmtSpend(row.values[subName]));
        });
        bar.addEventListener("mouseleave", tip.hide);
        s.appendChild(bar);
        cursorY -= h;
      });
      var xt = svg("text", { class: "tick-label", x: cx, y: H - marginB + 16, "text-anchor": "middle" });
      xt.textContent = row.label.replace(/^\d{4}年/, "").replace("月", "");
      s.appendChild(xt);
    });
    container.appendChild(s);
  }

  function renderMonthlyRoleChart(container) {
    container.innerHTML = "";
    var W = 880, H = 300;
    var marginL = 54, marginR = 12, marginT = 24, marginB = 30;
    var plotW = W - marginL - marginR, plotH = H - marginT - marginB;

    var rows = MONTHS.map(function (m) { return { m: m, income: m.income, role: roleBreakdown(m) }; });
    var maxIncome = Math.max.apply(null, rows.map(function (r) { return r.income; }));
    var maxExpenseAbs = Math.max.apply(null, rows.map(function (r) { return ROLE_ORDER.reduce(function (s, k) { return s + Math.abs(r.role[k]); }, 0); }));
    var yMax = Math.ceil((maxIncome * 1.1) / 500000) * 500000;
    var yMin = -Math.ceil((maxExpenseAbs * 1.15) / 500000) * 500000;
    var yRange = yMax - yMin;
    function yToPx(v) { return marginT + plotH * (1 - (v - yMin) / yRange); }
    var baselineY = yToPx(0);

    var s = svg("svg", { viewBox: "0 0 " + W + " " + H, role: "img" });
    for (var g = Math.ceil(yMin / 1000000) * 1000000; g <= yMax; g += 1000000) {
      var gy = yToPx(g);
      s.appendChild(svg("line", { class: "gridline", x1: marginL, x2: W - marginR, y1: gy, y2: gy }));
      var t = svg("text", { class: "tick-label", x: marginL - 8, y: gy + 3, "text-anchor": "end" });
      t.textContent = fmtMan(g);
      s.appendChild(t);
    }
    s.appendChild(svg("line", { class: "baseline", x1: marginL, x2: W - marginR, y1: baselineY, y2: baselineY }));

    var slotW = plotW / rows.length;
    var barW = Math.min(15, slotW * 0.28);
    var gap = 3;
    var tip = makeTooltip(container);

    rows.forEach(function (row, i) {
      var cx = marginL + slotW * (i + 0.5);
      var incY = yToPx(row.income);
      var incBar = svg("rect", { class: "bar", x: cx - gap / 2 - barW, y: incY, width: barW, height: Math.max(baselineY - incY, 0.5), fill: "var(--series-income)", rx: 2, opacity: row.m.partial ? 0.5 : 1 });
      incBar.addEventListener("mousemove", function (e) {
        var r = container.getBoundingClientRect();
        tip.show(e.clientX - r.left, e.clientY - r.top - 10, row.m.label + " 収入", fmtYen(row.income));
      });
      incBar.addEventListener("mouseleave", tip.hide);
      s.appendChild(incBar);

      var cursorY = baselineY;
      ROLE_ORDER.forEach(function (roleName) {
        var val = row.role[roleName];
        var h = (Math.abs(val) / yRange) * plotH;
        if (h < 0.3) return;
        var bar = svg("rect", { class: "bar", x: cx + gap / 2, y: cursorY, width: barW, height: h, fill: ROLE_COLOR[roleName], opacity: row.m.partial ? 0.5 : 1 });
        bar.addEventListener("mousemove", function (e) {
          var r = container.getBoundingClientRect();
          tip.show(e.clientX - r.left, e.clientY - r.top - 10, row.m.label + " " + roleName, fmtSpend(val));
        });
        bar.addEventListener("mouseleave", tip.hide);
        s.appendChild(bar);
        cursorY += h;
      });

      var note = MONTH_NOTES[row.m.key];
      if (note) {
        var noteY = Math.min(incY, cursorY) - 8;
        var nt = svg("text", { class: "callout-label", x: cx, y: noteY, "text-anchor": "middle" });
        nt.textContent = note;
        s.appendChild(nt);
      }

      var xt = svg("text", { class: "tick-label", x: cx, y: H - marginB + 16, "text-anchor": "middle" });
      xt.textContent = row.m.label.replace(/^\d{4}年/, "").replace("月", "");
      s.appendChild(xt);
    });
    container.appendChild(s);
  }

  var LARGE_TXN_THRESHOLD = 30000;

  function levelWord(actual, avg) {
    if (!avg) return "";
    var ratio = Math.abs(actual) / Math.abs(avg);
    if (ratio >= 1.5) return "月平均（" + fmtSpend(avg) + "）より大幅に多い";
    if (ratio >= 1.15) return "月平均（" + fmtSpend(avg) + "）よりやや多い";
    if (ratio >= 0.85) return "月平均（" + fmtSpend(avg) + "）とほぼ同水準";
    if (ratio >= 0.5) return "月平均（" + fmtSpend(avg) + "）よりやや少ない";
    return "月平均（" + fmtSpend(avg) + "）より大幅に少ない";
  }

  function renderMonthReport(container, month) {
    var sec = el("section");
    sec.innerHTML = '<div class="section-head"><span class="eyebrow">レポート</span><h3>この月の収支分析</h3></div>';

    // --- 収支の分析結果 ---
    var avgNet = DATA.summary.recurringNetAvg;
    var diff = month.net - avgNet;
    var balanceP = el("p", "lede");
    var balanceText = "収入" + fmtSpend(month.income) + "に対し支出" + fmtSpend(month.expense) + "で、収支は" +
      (month.net >= 0 ? "+" + fmtSpend(month.net) + "の黒字" : "▲" + fmtSpend(month.net) + "の赤字") + "でした。" +
      "経常ベースの月平均収支（" + fmtYen(avgNet) + "）と比べると、" +
      (diff >= 0 ? fmtSpend(diff) + "上回っています。" : fmtSpend(diff) + "下回っています。");
    var note = MONTH_NOTES[month.key];
    if (note) balanceText += "この月は「" + note + "」の影響が大きく出ています。";
    balanceP.textContent = balanceText;
    sec.appendChild(balanceP);

    // --- 支出が多い部分 ---
    var cats = month.categories.slice(); // 昇順（マイナスが大きい＝支出が多い順）
    var totalExp = cats.reduce(function (s, c) { return s + c.total; }, 0);
    var top = cats.slice(0, 3);
    if (top.length) {
      var topWrap = el("div");
      topWrap.style.marginTop = "14px";
      topWrap.innerHTML = '<div class="sub-title">支出が多い部分（この月の上位' + top.length + 'カテゴリ）</div>';
      var ul = el("ul", "decision-list");
      top.forEach(function (c) {
        var pct = totalExp ? (c.total / totalExp * 100).toFixed(0) : "0";
        var avg = CATEGORY_TOTALS_MAP[c.name] / MONTHS.length;
        var li = el("li");
        li.textContent = c.name + "：" + fmtSpend(c.total) + "（この月の支出の" + pct + "%）。" + levelWord(c.total, avg) + "。";
        ul.appendChild(li);
      });
      topWrap.appendChild(ul);
      sec.appendChild(topWrap);
    }

    // --- 改善余地・特記事項（この月の大型出費） ---
    var largeTxns = [];
    cats.forEach(function (c) {
      c.transactions.forEach(function (t) {
        if (t.amount <= -LARGE_TXN_THRESHOLD) {
          largeTxns.push({ category: c.name, date: t.date, content: t.content, amount: t.amount, subcategory: t.subcategory });
        }
      });
    });
    largeTxns.sort(function (a, b) { return a.amount - b.amount; });
    var noteWrap = el("div");
    noteWrap.style.marginTop = "14px";
    noteWrap.innerHTML = '<div class="sub-title">改善余地・特記事項</div>';
    if (largeTxns.length) {
      var p = el("p", "lede");
      p.style.margin = "0 0 8px";
      p.textContent = "¥" + LARGE_TXN_THRESHOLD.toLocaleString("ja-JP") + "以上の大型出費が" + largeTxns.length + "件ありました。収支の改善を考える際は、まずここから確認するのが効率的です。";
      noteWrap.appendChild(p);
      var ul2 = el("ul", "decision-list");
      largeTxns.forEach(function (t) {
        var li = el("li");
        li.textContent = t.date.slice(5) + "　" + t.category + "（" + t.subcategory + "）　" + t.content + "　" + fmtSpend(t.amount);
        ul2.appendChild(li);
      });
      noteWrap.appendChild(ul2);
    } else {
      var p2 = el("p", "lede");
      p2.style.margin = "0";
      p2.textContent = "¥" + LARGE_TXN_THRESHOLD.toLocaleString("ja-JP") + "以上の突出した大型出費はありませんでした。日常的な支出が中心の月です。";
      noteWrap.appendChild(p2);
    }
    sec.appendChild(noteWrap);

    container.appendChild(sec);
  }

    grid.style.border = "1px solid var(--border)";
    ROLE_ORDER.forEach(function (r) {
      var pct = (Math.abs(rb[r]) / roleTotal * 100).toFixed(0);
      var c = el("div");
      c.style.background = "var(--surface)";
      c.style.padding = "14px 16px";
      c.innerHTML = '<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;"><span class="swatch" style="background:' + ROLE_COLOR[r] + '"></span><span style="font-size: 14px;color:var(--text-secondary);">' + r + '（' + pct + '%）</span></div>' +
        '<div style="font-variant-numeric:tabular-nums;font-size: 18px;font-weight:600;">' + fmtSpend(rb[r]) + '</div>';
      grid.appendChild(c);
    });
    s0.appendChild(grid);
    body.appendChild(s0);

    renderMonthReport(body, month);

    // category breakdown (excl 住宅) — クリックでその場に内訳を展開
    var s1 = el("section");
    s1.innerHTML = '<div class="section-head"><span class="eyebrow">01</span><h3>カテゴリ別支出（この月、住宅を除く）</h3></div>' +
      '<p class="lede">カテゴリ名またはバーをクリックすると、サブカテゴリ内訳と個別取引明細をその場で確認できます。</p>';
    var chart1 = el("div", "chart-wrap");
    var detailWrap = el("div");
    s1.appendChild(chart1);
    s1.appendChild(detailWrap);
    body.appendChild(s1);
    var catItems = month.categories.slice().sort(function (a, b) { return a.total - b.total; });
    var openCategory = null;

    function renderCategoryChart() {
      if (!catItems.length) {
        chart1.innerHTML = "";
        chart1.appendChild(el("div", "muted-row", "この月は取引がありません。"));
        return;
      }
      rankedBar(chart1, catItems, {
        onClick: function (c) { openCategory = openCategory === c.name ? null : c.name; renderCategoryChart(); },
        isActive: function (c) { return c.name === openCategory; }
      });
      detailWrap.innerHTML = "";
      if (openCategory) {
        var cat = catItems.filter(function (c) { return c.name === openCategory; })[0];
        var panel = el("div", "category-detail");
        var head = el("div", "category-detail-head");
        head.innerHTML = '<div><h4>' + cat.name + '</h4><div class="cd-total">' + fmtSpend(cat.total) + '</div></div>';
        var closeBtn = el("button", "cd-close", "✕ 閉じてカテゴリ一覧に戻る");
        closeBtn.addEventListener("click", function () { openCategory = null; renderCategoryChart(); chart1.scrollIntoView({ block: "start", behavior: "smooth" }); });
        head.appendChild(closeBtn);
        panel.appendChild(head);
        if (cat.subcategories.length > 1) {
          var subChart = el("div", "chart-wrap");
          panel.appendChild(subChart);
          rankedBar(subChart, cat.subcategories, { categorical: true, width: 640, labelW: 150 });
        }
        var txnWrap = el("div");
        txnWrap.style.marginTop = "10px";
        panel.appendChild(txnWrap);
        transactionTable(txnWrap, cat.transactions);
        detailWrap.appendChild(panel);
      }
    }
    renderCategoryChart();

    renderMonthRoleDetail(body, month);

    // 注目カテゴリ（趣味・娯楽／教養・教育／食費／現金・カード）：常に詳細表示
    var s2 = el("section");
    s2.innerHTML = '<div class="section-head"><span class="eyebrow">03</span><h3>注目カテゴリの詳細</h3></div>' +
      '<p class="lede">趣味・娯楽／教養・教育／食費／現金・カードは、サブカテゴリ内訳と個別取引明細を常に表示する。</p>';
    FEATURED_CATS.forEach(function (catName) {
      var cat = month.categories.filter(function (c) { return c.name === catName; })[0];
      var block = el("div", "deepdive-block");
      block.innerHTML = '<div class="deepdive-title"><h4>' + catName + '</h4><span class="dd-total">' + (cat ? fmtSpend(cat.total) : "―") + '</span></div>';
      if (cat && cat.subcategories.length > 1) {
        var subChart = el("div", "chart-wrap");
        block.appendChild(subChart);
        rankedBar(subChart, cat.subcategories, { categorical: true, width: 640, labelW: 150 });
      }
      var txnWrap = el("div");
      txnWrap.style.marginTop = "10px";
      block.appendChild(txnWrap);
      transactionTable(txnWrap, cat ? cat.transactions : []);
      s2.appendChild(block);
    });
    body.appendChild(s2);
  }

  // =========================================================
  // Boot
  // =========================================================
  document.getElementById("mhPeriod").textContent = MONTHS[0].label + " – " + MONTHS[MONTHS.length - 1].label;
  buildSidebar();
  setActive(MONTHS[MONTHS.length - 1].key);

})();
</script>

</body>
</html>
