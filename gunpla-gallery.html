<style>
  :root {
    --bg: #f5f5f5;
    --panel-bg: #ffffff;
    --text: #1a1a1a;
    --text-muted: #666666;
    --border: #e0e0e0;
    --accent: #2563eb;
    --accent-bg: #eef2ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --panel-bg: #1e2126;
      --text: #e8e8e8;
      --text-muted: #999999;
      --border: #2c2f36;
      --accent: #6ea8fe;
      --accent-bg: #1c2333;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .layout { display: flex; height: 100vh; }
  .sidebar {
    width: 300px;
    flex-shrink: 0;
    background: var(--panel-bg);
    border-right: 1px solid var(--border);
    overflow-y: auto;
  }
  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    cursor: pointer;
  }
  .sidebar-item:hover { background: var(--accent-bg); }
  .sidebar-item.active { background: var(--accent-bg); border-left: 3px solid var(--accent); }
  .sidebar-item img {
    width: 48px; height: 48px; object-fit: cover; border-radius: 6px; background: #000; flex-shrink: 0;
  }
  .sidebar-item .name { font-size: 0.85rem; line-height: 1.3; }
  .sidebar-list-link { font-weight: 600; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
  .main { flex: 1; overflow-y: auto; padding: 24px 32px; }
  .viewer {
    position: relative;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .viewer img {
    width: 100%; height: 70vh; max-height: 820px; object-fit: contain; display: block; background: #000;
  }
  .viewer .nav-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(0,0,0,0.5); color: #fff; border: none;
    width: 40px; height: 40px; border-radius: 50%; font-size: 1.4rem; cursor: pointer;
  }
  .viewer .prev { left: 12px; }
  .viewer .next { right: 12px; }
  .viewer .counter {
    position: absolute; bottom: 12px; right: 16px;
    background: rgba(0,0,0,0.6); color: #fff; font-size: 0.8rem;
    padding: 2px 10px; border-radius: 10px;
  }
  .filmstrip {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 2px 2px 18px;
  }
  .filmstrip img {
    width: 72px; height: 72px; object-fit: cover; border-radius: 6px;
    flex-shrink: 0; cursor: pointer; background: #000;
    opacity: 0.55; border: 2px solid transparent;
  }
  .filmstrip img.active { opacity: 1; border-color: var(--accent); }
  .info { max-width: 900px; }
  .info-toggle {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    cursor: default;
  }
  .info-toggle h1 { font-size: 1.4rem; margin: 0 0 6px; }
  .info-toggle .chev { display: none; }
  .info-body { display: block; }
  .info .period { color: var(--text-muted); font-size: 0.9rem; margin: 0 0 16px; }
  .info .desc { line-height: 1.7; margin: 0 0 16px; }
  .info .official-link { color: var(--accent); text-decoration: none; font-size: 0.9rem; }
  .info .official-link:hover { text-decoration: underline; }
  .home-grid { display: none; }
  .back-btn { display: none; }
  .detail-view { display: none; }
  .detail-view.active { display: block; }
  .pc-home-list { display: block; max-width: 900px; }
  .pc-home-list.hidden { display: none; }
  .pc-home-row {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 8px; cursor: pointer; border-radius: 8px;
  }
  .pc-home-row:hover { background: var(--accent-bg); }
  .pc-home-row img {
    width: 96px; height: 96px; object-fit: cover; border-radius: 8px; background: #000; flex-shrink: 0;
  }
  .pc-home-row .name { font-size: 1rem; }

  @media (max-width: 768px) {
    .layout { display: block; height: auto; }
    .sidebar { display: none; }
    .pc-home-list { display: none !important; }
    .home-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 16px;
    }
    .home-grid.hidden { display: none; }
    .home-card { cursor: pointer; }
    .home-card img {
      width: 100%; aspect-ratio: 3 / 4; object-fit: cover; object-position: center 20%; border-radius: 10px; background: #000;
    }
    .home-card .name { font-size: 0.85rem; margin-top: 6px; line-height: 1.3; }
    .main { display: none; padding: 16px; }
    .main.active { display: block; }
    .back-btn {
      display: inline-block; margin-bottom: 12px; background: none; border: none;
      color: var(--accent); font-size: 0.9rem; cursor: pointer; padding: 4px 0;
    }
    .viewer img { height: 58vh; }
    .filmstrip img { width: 56px; height: 56px; }
    .info-toggle {

    .info-toggle h1 { font-size: 1.05rem; margin: 0; }
    .info-toggle .chev { display: inline; color: var(--text-muted); font-size: 0.8rem; white-space: nowrap; }
    .info-body { display: none; padding-top: 10px; }
    .info.expanded .info-body { display: block; }
  }
</style>

</div>

const IMG_BASE = "images/gunpla-gallery/";

function imgSrc(work, filename) {
  return IMG_BASE + work.id + "/" + filename;
}

function sortedWorks() {
  return WORKS.slice().sort(function (a, b) { return b.sortKey - a.sortKey; });
}

let currentWork = null;
let currentIndex = 0;

function renderSidebar() {
  const sidebar = document.getElementById("sidebar");
  sidebar.innerHTML = "";
  sortedWorks().forEach(function (work) {
    const item = document.createElement("div");
    item.className = "sidebar-item";
    item.dataset.id = work.id;
    item.innerHTML =
      '<img src="' + imgSrc(work, work.images[work.thumbIndex]) + '" alt="' + work.name + '" loading="lazy" decoding="async">' +
      '<span class="name">' + work.name + '</span>';
    item.addEventListener("click", function () { selectWork(work.id); });
    sidebar.appendChild(item);
  });
}

function selectWork(id) {
  const work = WORKS.find(function (w) { return w.id === id; });
  if (!work) return;
  currentWork = work;
  currentIndex = 0;
  document.querySelectorAll(".sidebar-item").forEach(function (el) {
    el.classList.toggle("active", el.dataset.id === id);
  });
  document.getElementById("info").classList.remove("expanded");
  document.getElementById("infoChev").textContent = "詳細 ▾";
  document.getElementById("detailView").classList.add("active");
  document.getElementById("pcHomeList").classList.add("hidden");
  renderFilmstrip(work);
  renderDetail();
}

function renderPcHomeList() {
  const list = document.getElementById("pcHomeList");
  list.innerHTML = "";
  sortedWorks().forEach(function (work) {
    const row = document.createElement("div");
    row.className = "pc-home-row";
    row.dataset.id = work.id;
    row.innerHTML =
      '<img src="' + imgSrc(work, work.images[work.thumbIndex]) + '" alt="' + work.name + '" loading="lazy" decoding="async">' +
      '<span class="name">' + work.name + '</span>';
    row.addEventListener("click", function () { selectWork(work.id); });
    list.appendChild(row);
  });
}

function showList() {
  currentWork = null;
  document.getElementById("detailView").classList.remove("active");
  document.getElementById("pcHomeList").classList.remove("hidden");
  document.querySelectorAll(".sidebar-item").forEach(function (el) {
    el.classList.remove("active");
  });
  document.getElementById("sidebarListLink").classList.add("active");
}

document.getElementById("sidebarListLink").addEventListener("click", showList);

function renderFilmstrip(work) {
  const strip = document.getElementById("filmstrip");
  strip.innerHTML = "";
  work.images.forEach(function (filename, idx) {
    const img = document.createElement("img");
    img.src = imgSrc(work, filename);
    img.alt = work.name + " " + (idx + 1);
    img.loading = "lazy";
    img.decoding = "async";
    img.dataset.index = idx;
    img.addEventListener("click", function () {
      currentIndex = idx;
      renderDetail();
    });
    strip.appendChild(img);
  });
}

function syncFilmstrip() {
  document.querySelectorAll("#filmstrip img").forEach(function (img) {
    const isActive = Number(img.dataset.index) === currentIndex;
    img.classList.toggle("active", isActive);
    if (isActive) img.scrollIntoView({ inline: "center", block: "nearest" });
  });
}

function renderDetail() {
  if (!currentWork) return;
  document.getElementById("viewerImg").src = imgSrc(currentWork, currentWork.images[currentIndex]);
  document.getElementById("counter").textContent = (currentIndex + 1) + " / " + currentWork.images.length;
  document.getElementById("infoName").textContent = currentWork.name;
  document.getElementById("infoPeriod").textContent = currentWork.period;
  document.getElementById("infoDesc").textContent = currentWork.description;
  document.getElementById("infoUrl").href = currentWork.officialUrl;
  syncFilmstrip();
}

function showPrev() {
  if (!currentWork) return;
  currentIndex = (currentIndex - 1 + currentWork.images.length) % currentWork.images.length;
  renderDetail();
}

function showNext() {
  if (!currentWork) return;
  currentIndex = (currentIndex + 1) % currentWork.images.length;
  renderDetail();
}

document.getElementById("prevBtn").addEventListener("click", showPrev);
document.getElementById("nextBtn").addEventListener("click", showNext);
document.addEventListener("keydown", function (e) {
  if (e.key === "ArrowLeft") showPrev();
  if (e.key === "ArrowRight") showNext();
});

document.getElementById("infoToggle").addEventListener("click", function () {
  const info = document.getElementById("info");
  const expanded = info.classList.toggle("expanded");
  document.getElementById("infoChev").textContent = expanded ? "閉じる ▴" : "詳細 ▾";
});

function renderHomeGrid() {
  const grid = document.getElementById("homeGrid");
  grid.innerHTML = "";
  sortedWorks().forEach(function (work) {
    const card = document.createElement("div");
    card.className = "home-card";
    card.dataset.id = work.id;
    card.innerHTML =
      '<img src="' + imgSrc(work, work.images[work.thumbIndex]) + '" alt="' + work.name + '" loading="lazy" decoding="async">' +
      '<div class="name">' + work.name + '</div>';
    card.addEventListener("click", function () {
      selectWork(work.id);
      document.getElementById("main").classList.add("active");
      grid.classList.add("hidden");
    });
    grid.appendChild(card);
  });
}

document.getElementById("backBtn").addEventListener("click", function () {
  document.getElementById("main").classList.remove("active");
  document.getElementById("homeGrid").classList.remove("hidden");
});

renderSidebar();
renderHomeGrid();
renderPcHomeList();
</script>
</body>
